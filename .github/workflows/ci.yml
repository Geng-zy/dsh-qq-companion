name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 中文字体（文字图卡片测试用）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-wqy-zenhei fonts-dejavu-core fonts-noto-color-emoji
      - name: 安装 dsh 宿主（插件编译时链接它的 @deepseek-ai 包）
        run: npm install -g @deepseek-ai/dsh@0.2.1-rc.2
      - run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
      - run: ./scripts/build.sh
      - name: 单元测试 + 覆盖率
        run: ./node_modules/.bin/vitest run --coverage
      - name: 覆盖率摘要
        if: always()
        run: node -e "const t=require('./coverage/coverage-summary.json').total;console.log('| 指标 | 覆盖率 |\n|---|---|');for(const k of ['lines','statements','functions','branches'])console.log('| '+k+' | '+t[k].pct+'% |')" >> "$GITHUB_STEP_SUMMARY"
      - name: 端到端测试（真实 dsh + 假模型 + 假 NapCat）
        run: node scripts/e2e.mjs
